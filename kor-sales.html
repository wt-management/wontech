<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>wontech · 국내영업 매출현황</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📑</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f5f7fb;--card:#fff;--border:#e6eaf1;--line:#eef1f6;--ink:#1c2534;--ink2:#64748b;--ink3:#94a3b8;
  --accent:#2563eb;--accent-bg:#eaf1fd;--teal:#0891b2;--pos:#16a34a;--neg:#dc2626;--warn:#d97706;--purple:#7c3aed;
  --sb:#f1f5f9;--sb-hover:#e9eef5;--sb-active:#eaf1fd}
html,body{height:100%}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;color-scheme:light}
.mono,.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer}
/* ── 로딩/로그인 ── */
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:9000;color:var(--ink3);font-size:13px}
.spin{width:22px;height:22px;border:3px solid #dbe3ee;border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin-right:10px}
@keyframes sp{to{transform:rotate(360deg)}}
#login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f2540,#1e3a5f);z-index:9001;padding:20px}
.lbox{background:#fff;border-radius:18px;padding:34px 30px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lbox h1{font-size:17px;font-weight:800;color:var(--ink);margin-bottom:3px}
.lbox p{font-size:12px;color:var(--ink3);margin-bottom:20px}
.lbox input{width:100%;padding:11px 13px;border:1px solid #d5dde8;border-radius:9px;font-size:14px;margin-bottom:10px;font-family:inherit}
.lbox input:focus{outline:none;border-color:var(--accent)}
.lbox button{width:100%;padding:11px;background:var(--accent);color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:700;margin-top:4px}
#login-err{display:none;color:var(--neg);font-size:12px;margin-top:8px;text-align:center}
#noacc{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:9001;color:var(--ink);text-align:center;padding:30px}
/* ── 레이아웃 ── */
#app{display:none;min-height:100vh}
.wrap{display:flex;min-height:100vh}
.sidebar{width:212px;flex-shrink:0;background:var(--sb);border-right:1px solid #d8e0ea;box-shadow:3px 0 16px rgba(16,42,67,.05);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:18px 18px 14px;display:flex;align-items:center;gap:9px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#0891b2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.brand b{font-size:14px;font-weight:800;color:var(--ink);line-height:1.15}
.brand span{font-size:10.5px;color:var(--ink3);display:block}
.nav{flex:1;overflow-y:auto;padding:6px 10px}
.nav-h{font-size:10px;font-weight:700;color:var(--ink3);letter-spacing:.05em;padding:12px 10px 5px}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;color:#475569;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;margin:1px 0;transition:background .12s,color .12s}
.nav a:hover{background:var(--sb-hover)}
.nav a.on{background:var(--sb-active);color:var(--accent);font-weight:700}
.nav a i{width:16px;text-align:center;font-style:normal;font-size:14px;opacity:.85}
.sfoot{padding:10px;border-top:1px solid #d8e0ea}
.sw-wrap{position:relative}
.sw-btn{width:100%;background:#fff;border:1px solid #d5dde8;border-radius:8px;padding:8px 10px;color:#475569;font-size:12px;display:flex;align-items:center;gap:6px;text-align:left}
.sw-dd{display:none;position:absolute;bottom:112%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 -8px 24px rgba(16,42,67,.16);z-index:500;max-height:60vh;overflow-y:auto}
.sw-dd.open{display:block}
.sw-item{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:12px;color:#475569;cursor:pointer}
.sw-item:hover{background:var(--sb-hover)}
.sw-item .bdg{min-width:24px;height:18px;border-radius:4px;color:#fff;font-size:9.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;flex-shrink:0}
.uinfo{margin-top:8px;font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:7px;padding:0 4px}
.uinfo b{color:var(--ink);font-weight:600}
.uinfo button{margin-left:auto;background:none;border:none;color:var(--ink3);font-size:11px;text-decoration:underline}
/* ── 메인 ── */
.main{flex:1;min-width:0;padding:22px 26px 60px}
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.mast h2{font-size:20px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.mast .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.mast .asof{font-size:11.5px;color:var(--ink3)}
/* 필터바 */
.fbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.fbar .fl{font-size:11px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px}
.chip-btn{border:1px solid #d5dde8;background:#fff;color:#475569;font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px;transition:all .12s}
.chip-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.fbar select,.fbar input{border:1px solid #d5dde8;border-radius:8px;padding:6px 10px;font-size:12px;font-family:inherit;background:#fff;color:var(--ink)}
.fbar input.search{min-width:180px}
.sep{width:1px;height:22px;background:var(--border);margin:0 3px}
.btn{border:1px solid #d5dde8;background:#fff;color:#475569;font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px}
.btn:hover{background:var(--sb-hover)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.kpi .l{font-size:11.5px;color:var(--ink2);font-weight:600;display:flex;align-items:center;gap:5px}
.kpi .v{font-size:1.9rem;font-weight:800;line-height:1.05;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:11.5px;color:var(--ink3);margin-top:3px}
.kpi.hero{background:linear-gradient(135deg,#eef5ff,#f7fbff);border-color:#dbe6f5}
/* cards/grid */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;min-width:0}
.card .sec{font-size:13.5px;font-weight:800;color:var(--ink);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card .sec .hint{font-size:11px;font-weight:500;color:var(--ink3)}
canvas{max-height:260px}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{font-size:10.5px;font-weight:700;color:var(--ink3);letter-spacing:.02em;padding:7px 9px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;position:sticky;top:0;background:var(--card);cursor:pointer;user-select:none}
.tbl th.l{text-align:left}.tbl th:hover{color:var(--accent)}
.tbl td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl td.l{text-align:left}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:#f8fafc}
.tbl .rk{color:var(--ink3);font-weight:700;text-align:center;width:26px}
.tbl .nm{font-weight:600;color:var(--ink)}
.tbl b{color:var(--ink)}
.mut{color:var(--ink3)}
.tbar{background:#eef2f7;height:7px;border-radius:4px;overflow:hidden;min-width:52px}
.tbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.scroll{overflow:auto;max-height:64vh;border:1px solid var(--line);border-radius:12px}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:10.5px;font-weight:700;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.ins{margin-top:14px;font-size:12px;color:#475569;background:#fffbeb;border:1px solid #fde68a;border-radius:11px;padding:10px 14px;line-height:1.55}
/* modal */
.modal{position:fixed;inset:0;background:rgba(16,42,67,.42);display:none;align-items:center;justify-content:center;z-index:8000;padding:16px}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.mhd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
.mhd h3{font-size:16px;font-weight:800}
.mhd .x{background:none;border:none;font-size:20px;color:var(--ink3);line-height:1}
.mbody{padding:16px 20px 22px}
.drow{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.drow .k{color:var(--ink2);flex-shrink:0}
.drow .v{font-weight:600;color:var(--ink);text-align:right}
.dsec{font-size:11px;font-weight:800;color:var(--accent);letter-spacing:.03em;margin:16px 0 4px;text-transform:uppercase}
.tl{display:flex;gap:0;margin:10px 0}
.tl .st{flex:1;text-align:center;position:relative;font-size:10.5px}
.tl .st .dot{width:11px;height:11px;border-radius:50%;background:#cbd5e1;margin:0 auto 4px;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1}
.tl .st.done .dot{background:var(--pos);box-shadow:0 0 0 1px var(--pos)}
.tl .st .dt{color:var(--ink3);font-size:10px}
.tl .st b{display:block;color:var(--ink);font-weight:600;margin-bottom:1px}
.tl .st:not(:last-child):after{content:'';position:absolute;top:5px;left:50%;width:100%;height:2px;background:#e2e8f0;z-index:-1}
#toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c2534;color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9500}
.empty{color:var(--ink3);font-size:13px;text-align:center;padding:30px}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;z-index:600}
  .sidebar.open{transform:none}
  .g2,.g3{grid-template-columns:1fr}
  .main{padding:16px 14px 60px}
  .mtoggle{display:inline-flex!important}
}
.mtoggle{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid #d5dde8;background:#fff;font-size:16px}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>

<div id="load"><div class="spin"></div>불러오는 중…</div>

<div id="login">
  <div class="lbox">
    <h1>📑 국내영업 매출현황</h1>
    <p>원텍 국내 계약 관리 · 로그인</p>
    <input id="li" type="email" placeholder="이메일" autocomplete="username">
    <input id="lp" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">로그인</button>
    <div id="login-err">이메일 또는 비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<div id="noacc">
  <div style="font-size:16px;margin-bottom:14px">⚠ 국내영업 매출현황 접근 권한이 없습니다.<br>관리자에게 문의해주세요.</div>
  <button class="btn" onclick="doLogout()">로그아웃</button>
</div>

<div id="app">
<div class="wrap">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">📑</div><div><b>국내영업</b><span>매출·계약 현황</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sfoot">
      <div class="sw-wrap">
        <button class="sw-btn" onclick="document.getElementById('swdd').classList.toggle('open')"><i style="font-style:normal">▤</i><span style="flex:1;font-weight:600">사이트 이동</span><span style="font-size:9px">▲</span></button>
        <div class="sw-dd" id="swdd"></div>
      </div>
      <div class="uinfo"><span id="ui-name">-</span><button onclick="changePw()">비번</button><button onclick="doLogout()">로그아웃</button></div>
    </div>
  </aside>

  <main class="main">
    <div class="mast">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="mtoggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <div><h2 id="v-title">📊 종합 현황</h2><div class="sub" id="v-sub">국내 거래처별 계약체결 관리</div></div>
      </div>
      <div class="asof" id="asof"></div>
    </div>

    <div class="fbar">
      <span class="fl">📅 조회 월</span>
      <span id="mchips"></span>
      <div class="sep"></div>
      <select id="f-channel" onchange="applyF()"><option value="">전체 채널</option></select>
      <select id="f-rep" onchange="applyF()"><option value="">전체 담당자</option></select>
      <select id="f-product" onchange="applyF()"><option value="">전체 제품</option></select>
      <select id="f-status" onchange="applyF()"><option value="">전체 상태</option></select>
      <div class="sep"></div>
      <input class="search" id="f-search" placeholder="🔍 거래처·제품 검색" oninput="applyF()">
      <button class="btn" onclick="resetF()">초기화</button>
      <span id="fcount" class="fl" style="margin-left:auto"></span>
    </div>

    <div id="view-overview" class="view on"></div>
    <div id="view-rep" class="view"></div>
    <div id="view-product" class="view"></div>
    <div id="view-channel" class="view"></div>
    <div id="view-pay" class="view"></div>
    <div id="view-list" class="view"></div>
    <div id="view-pending" class="view"></div>
  </main>
</div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>

<script>
const SUPA_URL='https://mhfacbsittfdkknwybhc.supabase.co';
const SUPA_KEY='sb_publishable_aPMOOWAlyJlMcP1ZM_gpPA_jlrcvCRd';
const CENTRAL='https://wt-management.github.io/wontech/';
const _sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let DATA=null, ROWS=[], F={months:new Set(), channel:'', rep:'', product:'', status:'', search:''}, _charts=[], curView='overview', ME='';

/* ── 유틸 ── */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function jsq(s){return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function won(v){v=Math.round(v||0);return v>=1e8?(v/1e8).toFixed(1)+'억':v>=1e4?Math.round(v/1e4).toLocaleString()+'만':v.toLocaleString();}
function won2(v){return ((v||0)/1e8).toFixed(2)+'억';}
function fmt(v){return Math.round(v||0).toLocaleString();}
function pctv(a,b){return b>0?Math.round(a/b*100):0;}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200);}
function sum(a,k){return a.reduce((s,x)=>s+(x[k]||0),0);}
function grp(a,k){const m={};a.forEach(x=>{const v=x[k]||'미분류';(m[v]=m[v]||[]).push(x);});return m;}
function closeModal(){document.getElementById('modal').classList.remove('on');}

/* ── 인증 부트 ── */
(function _sso(){ // 스위처에서 #at=&rt= 로 넘어온 세션 소비
  var h=(location.hash||'').replace(/^#/,''); if(h.indexOf('at=')<0)return;
  var p={}; h.split('&').forEach(function(kv){var i=kv.indexOf('=');if(i>0)p[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
  if(p.at&&p.rt){ try{ _sb.auth.setSession({access_token:p.at,refresh_token:p.rt}); }catch(e){} }
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
})();
async function allowed(user){ if((user.email||'')==='pmw0406@gmail.com')return true;
  try{ const {data:p}=await _sb.from('crm_profiles').select('access,role,dept').eq('id',user.id).maybeSingle();
    if(!p)return false; if(p.role==='admin')return true;
    if(String(p.dept||'').replace(/\s/g,'').includes('영업전략'))return true;   // 영업전략파트 전원
    const ac=(p.access||'').split(',').map(s=>s.trim());
    return ac.indexOf('all')>=0;
  }catch(e){return false;} }
async function enter(user){ ME=user.email||'';
  if(!(await allowed(user))){ document.getElementById('load').style.display='none'; document.getElementById('noacc').style.display='flex'; return; }
  try{ const {data:pr}=await _sb.from('crm_profiles').select('display_name,dept,position').eq('id',user.id).maybeSingle();
    document.getElementById('ui-name').innerHTML='<b>'+esc((pr&&pr.display_name)||ME.split('@')[0])+'</b>'+((pr&&pr.dept)?' · '+esc(pr.dept):''); }catch(e){ document.getElementById('ui-name').innerHTML='<b>'+esc(ME.split('@')[0])+'</b>'; }
  await loadData(); await renderSwitcher();
  document.getElementById('load').style.display='none'; document.getElementById('app').style.display='block';
  buildNav(); initFilters(); route();
}
async function boot(){ let {data}=await _sb.auth.getSession();
  if(!(data&&data.session)){ await new Promise(r=>setTimeout(r,450)); ({data}=await _sb.auth.getSession()); }
  if(data&&data.session) await enter(data.session.user);
  else{ document.getElementById('load').style.display='none'; document.getElementById('login').style.display='flex'; } }
async function doLogin(){ const e=(document.getElementById('li').value||'').trim(),p=(document.getElementById('lp').value||'').trim();
  const er=document.getElementById('login-err'); er.style.display='none';
  const {data,error}=await _sb.auth.signInWithPassword({email:e,password:p});
  if(error){ er.style.display='block'; return; } document.getElementById('login').style.display='none'; document.getElementById('load').style.display='flex'; await enter(data.user); }
async function doLogout(){ try{await _sb.auth.signOut();}catch(e){} Object.keys(localStorage).filter(k=>k.startsWith('sb-')).forEach(k=>localStorage.removeItem(k)); location.href=CENTRAL; }
async function changePw(){ const np=prompt('새 비밀번호 (6자 이상)'); if(np===null)return; if((np||'').length<6){alert('6자 이상이어야 합니다.');return;} if(prompt('확인을 위해 다시 입력')!==np){alert('일치하지 않습니다.');return;} const r=await _sb.auth.updateUser({password:np}); if(r.error){alert('변경 실패: '+r.error.message);return;} alert('변경되었습니다.'); }

/* ── 데이터 로드 ── */
async function loadData(){
  try{ const {data}=await _sb.from('cons_cache').select('data').eq('key','kor_sales').maybeSingle();
    DATA=(data&&data.data)||{contracts:[]}; }catch(e){ DATA={contracts:[]}; }
  ROWS=(DATA.contracts||[]).map(function(c){ c._month=c.saleMonth||0; return c; }); // 매출월 기준(매출현황). 매출월 미지정건은 '전체'에만 집계
  document.getElementById('asof').textContent='기준일 '+(DATA.updatedAt||'-')+' · 총 '+ROWS.length+'건';
}

  document.querySelectorAll('#mchips .chip-btn').forEach(b=>{ const d=b.dataset.m; b.classList.toggle('on', d==='all'?F.months.size===0:F.months.has(+d)); });

function applyF(){ F.channel=document.getElementById('f-channel').value; F.rep=document.getElementById('f-rep').value; F.product=document.getElementById('f-product').value; F.status=document.getElementById('f-status').value; F.search=(document.getElementById('f-search').value||'').trim().toLowerCase(); render(); }
function resetF(){ F={months:new Set(),channel:'',rep:'',product:'',status:'',search:''}; ['f-channel','f-rep','f-product','f-status','f-search'].forEach(id=>document.getElementById(id).value=''); document.querySelectorAll('#mchips .chip-btn').forEach(b=>b.classList.toggle('on',b.dataset.m==='all')); render(); }
function filtered(){ return ROWS.filter(r=>{
  if(F.months.size&&!F.months.has(r._month))return false;
  if(F.channel&&r.channel!==F.channel)return false;
  if(F.rep&&r.rep!==F.rep)return false;
  if(F.product&&r.product!==F.product)return false;
  if(F.status&&r.status!==F.status)return false;
  if(F.search){ const s=(r.cust+' '+r.product+' '+r.rep+' '+r.ceo).toLowerCase(); if(s.indexOf(F.search)<0)return false; }
  return true; });
}

  '</div>';
  h+='<div class="card"><div class="sec">⏳ 미납·미완 관리 대상 <span class="hint">· 행 클릭 상세</span></div>'+
    (unpaid.length?'<div class="scroll"><table class="tbl"><thead><tr><th class="rk">#</th><th class="l">거래처</th><th class="l">제품</th><th>금액</th><th class="l">담당자</th><th>매출월</th><th class="l">상태</th><th class="l">세금계산서</th></tr></thead><tbody>'+
    unpaid.map(c=>'<tr onclick="detail('+c.no+')"><td class="rk">'+c.no+'</td><td class="l nm">'+esc(c.cust)+'</td><td class="l">'+esc(c.product)+'</td><td><b>'+fmt(c.krw)+'</b></td><td class="l">'+esc(c.rep)+'</td><td>'+(c.saleMonth?c.saleMonth+'월':'-')+'</td><td class="l">'+stChip(c.status)+'</td><td class="l mut">'+esc(c.dTax||'미발행')+'</td></tr>').join('')+
    '</tbody></table></div>':'<div class="empty">✅ 미납·미완 계약이 없습니다</div>')+'</div>';
  document.getElementById('view-pending').innerHTML=h;
}

/* ── 상세 모달 ── */
function detail(no){
  const c=ROWS.find(r=>r.no===no); if(!c)return;
  const row=(k,v)=>'<div class="drow"><span class="k">'+k+'</span><span class="v">'+(v||'-')+'</span></div>';
  const steps=[['계약접수',c.dContract],['출고예정',c.dShipDue],['납품예정',c.dDeliverDue],['납품완료',c.dDelivered],['세금계산서',c.dTax]];
  const tl='<div class="tl">'+steps.map(s=>'<div class="st'+(s[1]?' done':'')+'"><div class="dot"></div><b>'+s[0]+'</b><span class="dt">'+esc(s[1]||'-')+'</span></div>').join('')+'</div>';
  let h='<div class="mhd"><div><h3>'+esc(c.cust)+'</h3><div class="mut" style="font-size:12px;margin-top:2px">'+esc(c.product)+' · '+chChip(c.channel)+' '+stChip(c.status)+'</div></div><button class="x" onclick="closeModal()">✕</button></div>'+
    '<div class="mbody">'+
    '<div class="dsec">계약</div>'+row('계약금액(VAT포함)',fmt(c.amount)+'원')+row('매출(원화환산)','<b>'+fmt(c.krw)+'원</b>')+row('수량',(c.qty||0)+'대')+row('담당자',esc(c.rep))+row('매출월',c.saleMonth?c.saleMonth+'월':'-')+
    '<div class="dsec">진행 단계</div>'+tl+
    '<div class="dsec">거래처 정보</div>'+row('대표자',esc(c.ceo))+row('진료과·종목',esc(c.bizRaw||c.biz))+row('지역',esc(c.region))+row('주소',esc(c.addr))+row('사업자번호',esc(c.biznum))+row('이메일',esc(c.email))+
    '<div class="dsec">수금·기타</div>'+row('수금방법',esc(c.pay))+row('원텍몰 적립',esc(c.mall))+row('수수료 지급',esc(c.commission))+
    '</div>';
  document.getElementById('mbox').innerHTML=h; document.getElementById('modal').classList.add('on');
}

/* ── CSV ── */
function exportCsv(){
  const R=filtered().slice().sort((a,b)=>a.no-b.no);
  const cols=[['no','NO'],['cust','거래처'],['product','제품'],['amount','계약금액'],['krw','원화환산'],['rep','담당자'],['channel','채널'],['status','상태'],['saleMonth','매출월'],['region','지역'],['biz','진료과'],['pay','수금방법'],['dContract','계약접수'],['dDelivered','납품일'],['dTax','세금계산서']];
  let csv='\ufeff'+cols.map(c=>c[1]).join(',')+'\n';
  R.forEach(r=>{ csv+=cols.map(c=>{let v=r[c[0]];v=(v==null?'':String(v)).replace(/"/g,'""');return /[",\n]/.test(v)?'"'+v+'"':v;}).join(',')+'\n'; });
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='국내영업_계약_'+(DATA.updatedAt||'')+'.csv'; a.click(); toast('CSV 내보내기 완료');
}

/* ── 사이트 스위처 ── */
async function renderSwitcher(){
  let reg=[]; try{ reg=(await _sb.from('site_registry').select('*').order('sort_order')).data||[]; }catch(e){}
  let ac=[],ad=false,st=false; try{ const s=(await _sb.auth.getSession()).data.session; if(s&&s.user){ if(s.user.email==='pmw0406@gmail.com')ad=true; const p=await _sb.from('crm_profiles').select('access,role,dept').eq('id',s.user.id).maybeSingle(); if(p&&p.data){ac=(p.data.access||'').split(',').map(x=>x.trim()).filter(Boolean); if(p.data.role==='admin')ad=true; st=String(p.data.dept||'').replace(/\s/g,'').includes('영업전략');} } }catch(e){}
  const vis=s=>{ if(ac.indexOf(s.key)>=0)return true; if(s.admin_bypass&&ad)return true; if(s.extra_visible_rule){try{return !!(new Function('access','isAdmin','isStrat','return('+s.extra_visible_rule+')'))(ac,ad,st);}catch(e){return false;}} return false; };
  const seen={}; const items=reg.filter(s=>{ if(!vis(s))return false; const d=(s.url==='LOCAL'||s.key==='korea')?'wontech':s.url; if(seen[d])return false; seen[d]=1; return true; });
  document.getElementById('swdd').innerHTML=items.map((s,i)=>'<div class="sw-item" onclick="swGo('+i+')"><span class="bdg" style="background:'+(s.grad_from||'#64748b')+'">'+esc(s.badge||'')+'</span>'+esc(s.title||s.key)+'</div>').join('')||'<div class="sw-item mut">이동 가능한 사이트 없음</div>';
  window._swItems=items;
}
async function swGo(i){ const s=window._swItems[i]; if(!s)return; let u=(s.url==='LOCAL'||s.key==='korea')?CENTRAL:s.url; let sess=null; try{sess=(await _sb.auth.getSession()).data.session;}catch(e){} if(sess&&u.indexOf('#')<0)u+='#at='+encodeURIComponent(sess.access_token)+'&rt='+encodeURIComponent(sess.refresh_token); location.href=u; }
document.addEventListener('click',e=>{ if(!e.target.closest('.sw-wrap'))document.getElementById('swdd').classList.remove('open'); });
